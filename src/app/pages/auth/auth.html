<div class="auth-container">
  <app-loading-overlay [visible]="loading" />
  <div class="auth-form">
    <app-logo
      [mainText]="'Everything we can manage it'"
      [highlight]="'S & H'"
      [mainColor]="mainColor"
    ></app-logo>
    <h2>{{ isLoginMode ? 'เข้าสู่ระบบ' : 'ลงทะเบียน' }}</h2>

    <form (ngSubmit)="onSubmit(form)" #form="ngForm">
      <!-- 👤 เฉพาะตอนสมัคร -->
      <input
        *ngIf="!isLoginMode"
        [(ngModel)]="registerForm.name"
        name="name"
        placeholder="ชื่อ-นามสกุล"
        required
      />

      <!-- 📧 Email -->
      <input
        *ngIf="isLoginMode"
        [(ngModel)]="loginForm.email"
        name="loginEmail"
        placeholder="อีเมล"
        required
      />
      <input
        *ngIf="!isLoginMode"
        [(ngModel)]="registerForm.email"
        name="registerEmail"
        placeholder="อีเมล"
        required
      />

      <!-- 🔐 Password -->
      <input
        *ngIf="isLoginMode"
        [(ngModel)]="loginForm.password"
        name="loginPassword"
        type="password"
        placeholder="รหัสผ่าน"
        required
      />
      <input
        *ngIf="!isLoginMode"
        [(ngModel)]="registerForm.password"
        name="registerPassword"
        type="password"
        placeholder="รหัสผ่าน"
        required
      />

      <button type="submit">
        {{ isLoginMode ? 'เข้าสู่ระบบ' : 'ลงทะเบียน' }}
      </button>
    </form>

    <u (click)="toggleMode(form)" class="switch-link">
      {{ isLoginMode ? 'ยังไม่มีบัญชีใช่ไหม? ลงทะเบียน' : 'มีบัญชีอยู่แล้ว?
      เข้าสู่ระบบ' }}
    </u>
  </div>
</div>
